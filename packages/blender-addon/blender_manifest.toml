schema_version = "1.0.0"

id = "blendlink"
version = "0.9.0"
name = "Blendlink"
tagline = "Publish artist-authored Blender scenes to Three.js"
maintainer = "Michael Rowe Jones <michaelrowejones@gmail.com>"
type = "add-on"

website = "https://github.com/michaelrowejones/Blendlink"
tags = ["Pipeline", "Development", "3D View"]

blender_version_min = "4.2.0"

# This standalone Blender Extension artifact is GPL-3.0-or-later. The separate
# npm aggregate has an explicit MIT/GPL/Apache file-level map in LICENSES.md.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Michael Rowe Jones"]

[permissions]
files = "Read scenes and save preview tools, captures and website exports"
clipboard = "Copy preview, connect, publish, and website instructions"
# Preview and Publish run the Blendlink command-line tool. When a website
# project already provides it, nothing is fetched; with no project connected,
# the first preview downloads that tool from npm on the artist's request. That
# is a network access, and declaring it is the honest thing to do even though
# Blender itself makes no request.
network = "Download verified preview tools and matching scene compiler"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/tests/",
  "**/*_test.py",
]
