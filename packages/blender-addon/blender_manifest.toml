schema_version = "1.0.0"

id = "blendlink"
version = "0.9.0"
name = "Blendlink"
tagline = "Publish artist-authored Blender scenes to Three.js"
maintainer = "Michael Rowe Jones <michaelrowejones@gmail.com>"
type = "add-on"

website = "https://github.com/michaelrowejones/Blendlink"
tags = ["Pipeline", "Development", "3D View"]

blender_version_min = "4.2.0"

# This standalone Blender Extension artifact is GPL-3.0-or-later. The separate
# npm aggregate has an explicit MIT/GPL/Apache file-level map in LICENSES.md.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Michael Rowe Jones"]

[permissions]
files = "Read manifests and write requested project captures"
clipboard = "Copy preview, connect, publish, and website instructions"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/tests/",
  "**/*_test.py",
]
