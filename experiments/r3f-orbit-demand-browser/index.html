<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Blendlink R3F Orbit demand browser gate</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #07101a;
        color: #eff7ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(980px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0; }
      header { display: grid; gap: 10px; margin-bottom: 22px; }
      h1, p { margin: 0; }
      h1 { font-size: clamp(30px, 5vw, 52px); letter-spacing: -0.045em; }
      header p { max-width: 760px; color: #9fb0c5; line-height: 1.55; }
      #status {
        width: fit-content;
        padding: 7px 11px;
        border: 1px solid #34506a;
        border-radius: 999px;
        background: #0d1b29;
        color: #acd0ec;
        font: 700 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      article {
        overflow: hidden;
        border: 1px solid #27435a;
        border-radius: 20px;
        background: linear-gradient(145deg, #102235, #0b1725);
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }
      #canvas-host { height: 520px; background: #07101a; }
      #canvas-host canvas { display: block; width: 100% !important; height: 100% !important; }
      pre {
        min-height: 92px;
        margin: 0;
        padding: 17px 20px;
        border-top: 1px solid #27435a;
        color: #8fe4c2;
        font: 600 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div id="status">PREPARING PRODUCTION R3F SCENE</div>
        <h1>Orbit sleeps when the artist stops.</h1>
        <p>
          This gate drives Blendlink's built-in Orbit camera through a real
          React Three Fiber demand Canvas. Drag the scene: input wakes it,
          Three's damping keeps it alive, and the loop goes quiet again.
        </p>
      </header>
      <article>
        <div id="canvas-host"></div>
        <pre id="facts">waiting for ready handle…</pre>
      </article>
    </main>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
