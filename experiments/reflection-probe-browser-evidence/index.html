<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Blendlink reflection-probe browser evidence</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #101419;
        color: #e8edf4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main {
        width: min(1040px, calc(100% - 32px));
        margin: 24px auto 48px;
      }
      h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 38px); }
      p { max-width: 78ch; color: #aab6c5; line-height: 1.55; }
      .stage {
        overflow: hidden;
        border: 1px solid #35404f;
        border-radius: 16px;
        background: #07090c;
        box-shadow: 0 18px 60px rgb(0 0 0 / 35%);
      }
      canvas { display: block; width: 100%; height: auto; }
      #status {
        display: block;
        margin: 12px 0;
        min-height: 24px;
        color: #8ee0b8;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .faces {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        margin-top: 18px;
      }
      .face {
        min-width: 0;
        padding: 10px;
        border: 1px solid #35404f;
        border-radius: 10px;
        background: #1b222c;
      }
      .swatch {
        height: 36px;
        margin-bottom: 8px;
        border-radius: 6px;
        border: 1px solid rgb(255 255 255 / 18%);
        background: rgb(
          calc(var(--r) * 255)
          calc(var(--g) * 255)
          calc(var(--b) * 255)
        );
      }
      .face strong, .face output {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .face output {
        margin-top: 4px;
        color: #aab6c5;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      @media (max-width: 720px) {
        .faces { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reflection-probe browser evidence</h1>
      <p>
        The sphere is a closed assigned receiver whose authored material is
        replaced transactionally with a PMREM generated by Blendlink's
        production runtime-capture seam.
      </p>
      <div class="stage">
        <canvas id="stage" width="720" height="480" aria-label="Captured local reflection on a metallic sphere"></canvas>
      </div>
      <output id="status">Preparing WebGL capture…</output>
      <section class="faces" aria-label="Cube face center readbacks">
        <div class="face" data-face="0"><div class="swatch"></div><strong>+X</strong><output></output></div>
        <div class="face" data-face="1"><div class="swatch"></div><strong>−X</strong><output></output></div>
        <div class="face" data-face="2"><div class="swatch"></div><strong>+Y</strong><output></output></div>
        <div class="face" data-face="3"><div class="swatch"></div><strong>−Y</strong><output></output></div>
        <div class="face" data-face="4"><div class="swatch"></div><strong>+Z</strong><output></output></div>
        <div class="face" data-face="5"><div class="swatch"></div><strong>−Z</strong><output></output></div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
