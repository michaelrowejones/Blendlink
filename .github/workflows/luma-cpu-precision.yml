name: Native Luma CPU precision qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/luma-cpu-precision.yml'
      - 'packages/blendlink/**'
      - 'packages/blender-addon/tests/compositor_luminance_key_check.py'
      - 'packages/blender-addon/tests/compositor_reference.py'
      - 'experiments/luma-cpu-precision/**'
      - 'experiments/native-compositor-differential/**'
      - 'scripts/lib/runtime-provenance.mjs'
      - 'package*.json'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: luma-cpu-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cpu:
    name: CPU Luma qualification / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-5.2
            expected_admission: PRODUCTION_QUALIFIED
            os: ubuntu-24.04
            version: '5.2.0'
            series: '5.2'
            extension: tar.xz
            sha256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
          - profile: windows-4.2
            expected_admission: PRODUCTION_QUALIFIED
            os: windows-2025
            version: '4.2.0'
            series: '4.2'
            extension: zip
            sha256: 'b6e72874f8cb5c4ed77f9b03d7f1fde851b9455a7ff02a1e1119c876318ebc65'
          - profile: windows-5.2
            expected_admission: PRODUCTION_QUALIFIED
            os: windows-2025
            version: '5.2.0'
            series: '5.2'
            extension: zip
            sha256: '2d184b626c001692c362291911293b6a297179d618d95e9e9192c3a80318adc4'
    env:
      # The native compositor remains CPU. The unused scene is an empty,
      # one-sample Cycles CPU render, so Windows needs no OpenGL scene context.
      BLENDLINK_LUMA_CPU_ORACLE_ENGINE: CYCLES
      BLENDLINK_LUMA_EXPECTED_SOURCE_ADMISSION: ${{ matrix.expected_admission }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache the checksum-qualified native archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blendlink-blender-${{ matrix.version }}-${{ runner.os }}.${{ matrix.extension }}
          key: luma-blender-${{ runner.os }}-${{ matrix.version }}-${{ matrix.sha256 }}

      - name: Download and verify native Blender on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
          BLENDER_ARCHIVE: ${{ runner.temp }}/blendlink-blender-${{ matrix.version }}-${{ runner.os }}.${{ matrix.extension }}
        run: |
          archive="$BLENDER_ARCHIVE"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            "https://download.blender.org/release/Blender$BLENDER_SERIES/blender-$BLENDER_VERSION-linux-x64.tar.xz" --output "$archive"
          fi
          # Always verify, including after an archive cache hit.
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender-luma"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender-luma" --strip-components=1
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender-luma/blender" >> "$GITHUB_ENV"

      - name: Download and verify native Blender on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
          BLENDER_ARCHIVE: ${{ runner.temp }}/blendlink-blender-${{ matrix.version }}-${{ runner.os }}.${{ matrix.extension }}
        run: |
          $archive = $env:BLENDER_ARCHIVE
          $url = "https://download.blender.org/release/Blender$env:BLENDER_SERIES/blender-$env:BLENDER_VERSION-windows-x64.zip"
          if (!(Test-Path -LiteralPath $archive)) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try { Invoke-WebRequest -Uri $url -OutFile $archive; break }
              catch { if ($attempt -eq 5) { throw }; Start-Sleep -Seconds 15 }
            }
          }
          # Always verify, including after an archive cache hit.
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:BLENDER_SHA256) { throw "Blender SHA-256 mismatch: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'blender-luma'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $directory = Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1
          $binary = Join-Path $directory.FullName 'blender.exe'
          if (!(Test-Path -LiteralPath $binary)) { throw 'Verified archive has no Blender executable' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BLENDLINK_BLENDER=$binary"

      - name: Install locked tools
        run: npm ci

      - name: Install Linux browser and software graphics dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium

      - name: Install Windows browser
        if: runner.os == 'Windows'
        run: npx --no-install playwright install chromium

      - name: Build the exact production candidate
        run: npm run build

      - name: Validate source-admission and trial evidence protocol
        run: node --test experiments/luma-cpu-precision/precision-protocol.test.mjs

      # These exact native profiles MUST emit production IR and pass the
      # bit-exact production browser path. Private trials cannot qualify them.
      - name: Capture Linux native CPU and compare ordinary and experimental contracts
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node experiments/luma-cpu-precision/qualify-host.mjs artifacts/verification-luma-cpu-host

      - name: Capture Windows native CPU and compare ordinary and experimental contracts
        if: runner.os == 'Windows'
        env:
          # Use the full bundled browser's new headless mode, not headless-shell.
          BLENDLINK_TEST_CHROMIUM_CHANNEL: chromium
          # Windows WebGPU queries ANGLE's ID3D11Device even for a Vulkan adapter.
          # WARP supplies that software device; Dawn still selects SwiftShader.
          BLENDLINK_TEST_CHROMIUM_ARGS: '["--use-angle=d3d11-warp","--use-webgpu-adapter=swiftshader","--enable-logging=stderr"]'
          DEBUG: pw:browser
        run: node experiments/luma-cpu-precision/qualify-host.mjs artifacts/verification-luma-cpu-host

      - name: Retain native source, mode controls, pixels and both browser API results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luma-cpu-qualification-${{ matrix.profile }}
          path: artifacts/verification-luma-cpu-host
          if-no-files-found: warn
          retention-days: 14
