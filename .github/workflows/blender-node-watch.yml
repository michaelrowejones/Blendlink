name: Observe upstream Blender nodes

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/blender-node-watch.yml'
      - 'config/blender-node-watch.json'
      - 'scripts/watch-blender-nodes*'
      - 'scripts/discover-blender-build.mjs'
      - 'scripts/acquire-blender-build.mjs'
      - 'scripts/lib/blender-build-*'
      - 'scripts/lib/blender-node-changes.mjs'
      - 'scripts/lib/node-port-*'
      - 'scripts/test-node-port.mjs'
      - 'scripts/node-port-blender.mjs'
      - 'scripts/node-ports.mjs'
      - 'scripts/blender-node-changes.test.mjs'
      - 'scripts/node-port-scaffold.test.mjs'
      - 'scripts/audit-node-coverage*'
      - 'node-ports/**'
      - 'docs/node-coverage/blender-5.3.0.json'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: blender-node-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-tests:
    name: Watcher protocol and ownership tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact observer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test protocols without downloading Blender or source
        run: |
          node --test scripts/lib/blender-build-*.test.mjs \
            scripts/blender-node-changes.test.mjs scripts/node-port-scaffold.test.mjs \
            scripts/lib/node-port-contract.test.mjs scripts/lib/node-port-python.test.mjs \
            scripts/watch-blender-nodes.test.mjs scripts/blender-node-watch-policy.test.mjs
          python3 scripts/audit-node-coverage.test.py

  observe:
    name: Official daily source and actual native catalog
    if: github.event_name != 'pull_request'
    needs: fast-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      BLENDLINK_WATCH_DISCOVERY: artifacts/blender-node-watch-discovery/discovery.json
    steps:
      - name: Check out the exact observer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Resolve one official build, checksum and full source identity
        id: discovery
        run: |
          mkdir -p artifacts/blender-node-watch-discovery
          node scripts/discover-blender-build.mjs --output "$BLENDLINK_WATCH_DISCOVERY" \
            2>artifacts/blender-node-watch-discovery/discovery.stderr.log \
            | tee artifacts/blender-node-watch-discovery/discovery.stdout.log
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { validateDiscovery } from "./scripts/lib/blender-build-discovery.mjs";
            const value = validateDiscovery(JSON.parse(readFileSync(process.env.BLENDLINK_WATCH_DISCOVERY, "utf8")));
            appendFileSync(process.env.GITHUB_OUTPUT, "archive-sha256=" + value.archive.sha256 + "\n");
          '
      - name: Cache archive bytes only
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blender-node-watch-archive-cache
          key: blender-daily-archive-${{ runner.os }}-${{ runner.arch }}-${{ steps.discovery.outputs.archive-sha256 }}
      - name: Install native binary dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libx11-6 libxi6 libxfixes3 \
            libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgomp1
      - name: Capture exact source, real catalog and unqualified work packets
        run: |
          node scripts/watch-blender-nodes.mjs \
            --config config/blender-node-watch.json \
            --discovery "$BLENDLINK_WATCH_DISCOVERY" \
            --cache-dir "$RUNNER_TEMP/blender-node-watch-archive-cache" \
            --output artifacts/blender-node-watch
      - name: Retain observations, source-only findings and failed steps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blender-node-watch-${{ github.run_id }}
          path: |
            artifacts/blender-node-watch-discovery
            artifacts/blender-node-watch
            !artifacts/blender-node-watch/.work/**
          if-no-files-found: warn
          retention-days: 30
