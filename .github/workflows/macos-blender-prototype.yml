name: macOS Blender contract prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-blender-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 / Blender ${{ matrix.version }} / prototype
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "4.2.0"
            series: "4.2"
            sha256: "241dbfa6dac2c3b5e15bb1c132e0fcf16f7bf6e5bf3959440b6c8052b7b26d08"
          - version: "5.2.0"
            series: "5.2"
            sha256: "ed4d8390166dec5ea0a2813a03db6221f206ce016442be7f59f41d760972568a"

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prove the runner meets the prototype contract
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/blendlink-macos-evidence"
          mkdir -p "$evidence"
          memory_bytes="$(sysctl -n hw.memsize)"
          {
            sw_vers
            uname -a
            echo "architecture=$(uname -m)"
            echo "memory_bytes=$memory_bytes"
            sysctl -n hw.model
            df -h "$RUNNER_TEMP"
          } | tee "$evidence/runner.txt"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This prototype requires a native arm64 macOS runner."
            exit 1
          fi
          if [ "$memory_bytes" -lt 8589934592 ]; then
            echo "::error::This runner is below Blender's documented 8 GB minimum RAM."
            exit 1
          fi

      - name: Download, verify, and mount exact Blender
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/blendlink-macos-evidence"
          archive_name="blender-$BLENDER_VERSION-macos-arm64.dmg"
          archive="$RUNNER_TEMP/$archive_name"
          manifest="$evidence/blender-$BLENDER_VERSION.sha256"
          base_url="https://download.blender.org/release/Blender$BLENDER_SERIES"
          curl --fail --location --retry 3 "$base_url/blender-$BLENDER_VERSION.sha256" --output "$manifest"
          if ! grep -Fqx "$BLENDER_SHA256  $archive_name" "$manifest"; then
            echo "::error::Official Blender checksum manifest does not contain the pinned macOS arm64 digest."
            exit 1
          fi
          curl --fail --location --retry 3 "$base_url/$archive_name" --output "$archive"
          printf '%s  %s\n' "$BLENDER_SHA256" "$archive" |
            shasum -a 256 --check | tee "$evidence/archive-checksum.txt"
          stat -f 'archive_bytes=%z' "$archive" | tee "$evidence/archive-size.txt"

          mount_point="$RUNNER_TEMP/blender-$BLENDER_VERSION-volume"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$archive" |
            tee "$evidence/hdiutil.txt"
          app="$mount_point/Blender.app"
          executable="$app/Contents/MacOS/Blender"
          if [ ! -x "$executable" ]; then
            echo "::error::Verified Blender DMG contains no executable at the expected application-bundle path."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 |
            tee "$evidence/codesign.txt"
          "$executable" --version | tee "$evidence/blender-version.txt"
          if ! grep -Fq "Blender $BLENDER_VERSION" "$evidence/blender-version.txt"; then
            echo "::error::Mounted Blender version does not match the pinned archive version."
            exit 1
          fi
          echo "BLENDLINK_BLENDER=$executable" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Run exact-version add-on and archive contract
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          set -o pipefail
          npm run test:addon-headless 2>&1 |
            tee "$RUNNER_TEMP/blendlink-macos-evidence/addon-headless-$BLENDER_VERSION.log"

      - name: Check patch whitespace
        run: git diff --check

      - name: Detach Blender disk image
        if: ${{ always() }}
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          mount_point="$RUNNER_TEMP/blender-$BLENDER_VERSION-volume"
          if [ -d "$mount_point" ]; then
            hdiutil detach "$mount_point" || true
          fi

      - name: Retain prototype evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blendlink-macos-arm64-blender-${{ matrix.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/blendlink-macos-evidence
          if-no-files-found: error
          retention-days: 14
