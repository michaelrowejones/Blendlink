# Temporary hosted qualification only. Keep this workflow off main/PRs.
name: Isolated Camera Data headed X11 qualification

on:
  push:
    branches: [codex/qualify-camera-data]

permissions:
  contents: read

concurrency:
  group: isolated-camera-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-data:
    name: Camera 5.2 OpenGL / ${{ matrix.browser }} / native + Final + both APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Actual native SIGTRAP traced to Ozone Headless's false X11 fallback.
          # All previous headless failures remain retained; no repeated baseline.
          - browser: headed-x11-graphite-swiftshader
            channel: chromium
            arguments: '["--ozone-platform=x11","--enable-gpu","--use-gl=angle","--use-angle=swiftshader","--enable-skia-graphite","--skia-graphite-dawn-backend=swiftshader","--use-webgpu-adapter=swiftshader"]'
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      BLENDLINK_CAMERA_DATA_NATIVE_BACKEND: OPENGL
      BLENDLINK_CAMERA_DATA_PROFILE: ordinary
      BLENDLINK_CAMERA_DATA_BUILT: '1'
      BLENDLINK_CAMERA_DATA_REFERENCES: artifacts/verification-camera-data-qa/ordinary
      BLENDLINK_CAMERA_DATA_NATIVE: artifacts/verification-camera-data-qa/ordinary
      BLENDLINK_TEST_PROFILE: software-${{ matrix.browser }}
      BLENDLINK_TEST_CHROMIUM_HEADLESS: '0'
      BLENDLINK_TEST_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      BLENDLINK_TEST_CHROMIUM_ARGS: ${{ matrix.arguments }}
      DEBUG: pw:browser
    steps:
      - name: Check out this isolated candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache checksum-pinned Blender archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blender-5.2.0-linux-x64.tar.xz
          key: blender-archive-${{ runner.os }}-${{ runner.arch }}-96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48

      - name: Download and verify actual Blender 5.2.0
        env:
          BLENDER_SHA256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
        run: |
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' \
              --output "$archive"
          fi
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
          echo "BLENDLINK_CAMERA_DATA_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and both bundled Chromium executables
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      - name: Isolate public WebGPU canvas presentation without Three or Camera Data
        run: |
          mkdir -p "$BLENDLINK_CAMERA_DATA_NATIVE"
          cp experiments/camera-data/chromium158-sources.json "$BLENDLINK_CAMERA_DATA_NATIVE/"
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test'
          import {createHash} from 'node:crypto'
          import {readFileSync,readdirSync,writeFileSync} from 'node:fs'
          import {dirname,join} from 'node:path'
          const binary=chromium.executablePath(),directory=dirname(binary)
          const files=readdirSync(directory).filter(name=>name==='chrome'||/swiftshader.*\.so$|^lib(?:EGL|GLESv2)\.so$/.test(name))
          writeFileSync(join(process.env.BLENDLINK_CAMERA_DATA_NATIVE,'browser-binary-pins.json'),JSON.stringify({binary,files:files.map(name=>({name,sha256:createHash('sha256').update(readFileSync(join(directory,name))).digest('hex')}))},null,2))
          JS
          if ! xvfb-run --auto-servernum node experiments/camera-data/canvas-probe.mjs \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/canvas-control-$BLENDLINK_TEST_PROFILE.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/canvas-control-$BLENDLINK_TEST_PROFILE.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/canvas-control-$BLENDLINK_TEST_PROFILE.log"

      - name: Render new actual OpenGL native references
        id: native
        run: |
          mkdir -p "$BLENDLINK_CAMERA_DATA_NATIVE"
          if ! xvfb-run --auto-servernum node experiments/camera-data/suite.mjs \
            --built --native-only --blender "$BLENDLINK_BLENDER" --profiles ordinary \
            --output artifacts/verification-camera-data-qa \
            > artifacts/verification-camera-data-qa/native-suite.log 2>&1; then
            cat artifacts/verification-camera-data-qa/native-suite.log
            exit 1
          fi
          cat artifacts/verification-camera-data-qa/native-suite.log

      - name: Export eight actual Final GLBs and independently verify their source pins
        id: final
        run: |
          if ! node node_modules/vitest/vitest.mjs run experiments/camera-data/export.test.ts \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/export.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/export.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/export.log"
          node scripts/check-camera-data-source.mjs "$BLENDLINK_CAMERA_DATA_NATIVE" OPENGL \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/source-reader.log" 2>&1
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/source-reader.log"

      - name: Compare strict WebGPU and WebGL2 native field pixels
        id: pixels
        run: |
          if ! xvfb-run --auto-servernum node experiments/camera-data/run.mjs --built \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/browser-$BLENDLINK_TEST_PROFILE.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/browser-$BLENDLINK_TEST_PROFILE.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/browser-$BLENDLINK_TEST_PROFILE.log"

      - name: Independently exercise actual Final private GPU storage
        if: ${{ !cancelled() && steps.final.outcome == 'success' }}
        id: ownership
        run: |
          if ! xvfb-run --auto-servernum node experiments/camera-data/run.mjs --built --ownership \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/ownership-$BLENDLINK_TEST_PROFILE.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/ownership-$BLENDLINK_TEST_PROFILE.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/ownership-$BLENDLINK_TEST_PROFILE.log"

      - name: Check copied built add-on namespace
        if: ${{ !cancelled() && steps.final.outcome == 'success' }}
        env:
          BLENDLINK_CAMERA_DATA_ADDON: packages/blendlink/dist/addon
        run: |
          if ! "$BLENDLINK_BLENDER" --background --factory-startup --python-exit-code 1 \
            --python experiments/camera-data/package_probe.py \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/package-probe.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/package-probe.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/package-probe.log"

      - name: Require complete strict reports from the actual requested software adapter
        if: ${{ !cancelled() && steps.final.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const canvas = JSON.parse(readFileSync(join(process.env.BLENDLINK_CAMERA_DATA_NATIVE,
            `canvas-control-${process.env.BLENDLINK_TEST_PROFILE}.json`), 'utf8'))
          assert.equal(canvas.complete, true)
          assert.equal(canvas.result.complete, true)
          assert.deepEqual(canvas.result.rgba, [255, 0, 0, 255])
          const identity = report => {
            assert.equal(report.requestedHeadless, false)
            assert.equal(report.browserVersion, '158.0.8127.18')
            assert.match(report.systemInfo.gpu.featureStatus.skia_graphite, /^enabled/)
            assert.equal(report.systemInfo.gpu.auxAttributes.skiaBackendType, 'GraphiteDawnVulkan')
            const actual = report.systemInfo.commandLine
            assert.equal(typeof actual, 'string')
            assert.match(actual, /(?:^|\s)--ozone-platform=x11(?:\s|$)/)
            assert.doesNotMatch(actual, /(?:^|\s)--headless(?:=|\s|$)/)
            assert.doesNotMatch(actual, /--ozone-platform=headless|--gpu-launcher=|--disable-gpu-sandbox/)
          }
          identity(canvas)
          if (process.env.BLENDLINK_TEST_PROFILE.includes('graphite')) {
            assert.equal(canvas.browserVersion, '158.0.8127.18')
            assert.match(canvas.systemInfo.gpu.featureStatus.skia_graphite, /^enabled/)
            assert.equal(canvas.systemInfo.gpu.auxAttributes.skiaBackendType, 'GraphiteDawnVulkan')
            assert.equal(canvas.result.adapter.architecture, 'swiftshader')
          }
          for (const [kind, cases] of [['browser', 240], ['ownership', 8]]) {
            const path = join(process.env.BLENDLINK_CAMERA_DATA_NATIVE, `${kind}-report-${process.env.BLENDLINK_TEST_PROFILE}.json`)
            const report = JSON.parse(readFileSync(path, 'utf8'))
            identity(report)
            assert.equal(report.built, true)
            assert.equal(report.complete, true)
            assert.equal(report.completedAllBackends, true)
            assert.equal(report.diagnosticDeviceLoss, false)
            assert.deepEqual(report.failures, [])
            assert.deepEqual(report.rows.map(row => row.backend), ['webgpu', 'webgl2'])
            assert.ok(report.provenance.modules.every(module => module.emitterMatchesSource))
            for (const row of report.rows) {
              assert.equal(row.cases, cases)
              assert.deepEqual(row.failures, [])
              assert.match(JSON.stringify(row.gpu), /swiftshader/i)
            }
            console.log('BLENDLINK_CAMERA_ISOLATED_STRICT_REPORT', kind, cases, 'cases per requested API')
          }
          JS

      - name: Retain all native, publication, failure and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-data-isolated-linux52-${{ matrix.browser }}
          path: artifacts/verification-camera-data-qa
          if-no-files-found: warn
