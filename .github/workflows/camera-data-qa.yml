# Temporary crash diagnosis only. Prior native/Final/numeric failures remain retained.
name: Isolated Camera WebGPU native crash backtrace

on:
  push:
    branches: [codex/qualify-camera-data]

permissions:
  contents: read

concurrency:
  group: isolated-camera-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-crash-backtrace:
    name: Unchanged Graphite plain canvas / native GPU backtrace / not qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      BLENDLINK_CAMERA_DATA_NATIVE: artifacts/verification-camera-gpu-crash
      BLENDLINK_TEST_PROFILE: graphite-gpu-native-backtrace
      BLENDLINK_TEST_CHROMIUM_CHANNEL: chromium
      DEBUG: pw:browser
    steps:
      - name: Check out exact diagnostic candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked browser and native debugger without build or Blender
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium

      - name: Prepare native GPU debugger and unchanged Graphite rendering flags
        run: |
          mkdir -p "$BLENDLINK_CAMERA_DATA_NATIVE"
          evidence="$(realpath "$BLENDLINK_CAMERA_DATA_NATIVE")"
          echo "BLENDLINK_GPU_CRASH_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          wrapper="$RUNNER_TEMP/blendlink-gpu-gdb.sh"
          cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -eu
          log="$BLENDLINK_GPU_CRASH_EVIDENCE/gpu-gdb-$$.log"
          printf 'BLENDLINK_GPU_DEBUGGER_WRAPPER_STARTED pid=%s\n' "$$" > "$log"
          exec gdb --quiet --batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set disable-randomization off' \
            -ex 'set print thread-events off' \
            -ex 'set print elements 32' \
            -ex 'handle SIGPIPE nostop noprint pass' \
            -ex 'handle SIGTRAP stop print nopass' \
            -ex 'run' \
            -ex 'info program' \
            -ex 'info sharedlibrary' \
            -ex 'info proc mappings' \
            -ex 'info registers' \
            -ex 'info symbol $pc' \
            -ex 'x/20i $pc-32' \
            -ex 'thread apply all bt 48' \
            --args "$@" >> "$log" 2>&1
          SH
          chmod +x "$wrapper"
          export BLENDLINK_GPU_GDB_WRAPPER="$wrapper"
          python3 - <<'PY'
          import json, os
          flags = ['--enable-gpu','--use-gl=angle','--use-angle=swiftshader',
                   '--enable-skia-graphite','--skia-graphite-dawn-backend=swiftshader',
                   '--use-webgpu-adapter=swiftshader']
          # Only debugger and logging instrumentation is added; renderer flags
          # are identical to the already-failed QA3 Graphite configuration.
          flags += ['--gpu-launcher=' + os.environ['BLENDLINK_GPU_GDB_WRAPPER'],
                    '--disable-gpu-sandbox',
                    '--enable-logging=stderr','--log-level=0']
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('BLENDLINK_TEST_CHROMIUM_ARGS=' + json.dumps(flags) + '\n')
          PY
          cp "$wrapper" "$BLENDLINK_CAMERA_DATA_NATIVE/gpu-debugger-wrapper.sh"
          # Calibrate debugger routing with a known signal in a separate folder;
          # it must never count as the browser's native-fault witness.
          mkdir -p "$evidence/debugger-control"
          BLENDLINK_GPU_CRASH_EVIDENCE="$evidence/debugger-control" \
            "$wrapper" /bin/sh -c 'kill -TRAP $$' || true
          gdb --version > "$BLENDLINK_CAMERA_DATA_NATIVE/gdb-version.txt"
          uname -a > "$BLENDLINK_CAMERA_DATA_NATIVE/host.txt"
          lscpu >> "$BLENDLINK_CAMERA_DATA_NATIVE/host.txt"
          free -m >> "$BLENDLINK_CAMERA_DATA_NATIVE/host.txt"
          cat /proc/sys/kernel/yama/ptrace_scope >> "$BLENDLINK_CAMERA_DATA_NATIVE/host.txt"
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test'
          import {createHash} from 'node:crypto'
          import {readFileSync,readdirSync,writeFileSync} from 'node:fs'
          import {dirname,join} from 'node:path'
          const binary=chromium.executablePath(),directory=dirname(binary)
          const files=readdirSync(directory).filter(name=>name==='chrome'||/swiftshader.*\.so$|^lib(?:EGL|GLESv2)\.so$/.test(name))
          writeFileSync(join(process.env.BLENDLINK_CAMERA_DATA_NATIVE,'browser-binary-pins.json'),JSON.stringify({binary,files:files.map(name=>({name,sha256:createHash('sha256').update(readFileSync(join(directory,name))).digest('hex')}))},null,2))
          JS

      - name: Capture actual plain canvas GPU failure under native debugger
        run: |
          if ! timeout --signal=TERM --kill-after=10s 150s xvfb-run --auto-servernum \
            node experiments/camera-data/canvas-probe.mjs \
            > "$BLENDLINK_CAMERA_DATA_NATIVE/plain-canvas-gdb.log" 2>&1; then
            cat "$BLENDLINK_CAMERA_DATA_NATIVE/plain-canvas-gdb.log"
            exit 1
          fi
          cat "$BLENDLINK_CAMERA_DATA_NATIVE/plain-canvas-gdb.log"

      - name: Require actual debugger routing and browser signal evidence
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs'
          import {join} from 'node:path'
          const root=process.env.BLENDLINK_CAMERA_DATA_NATIVE
          const logs=directory=>readdirSync(directory).filter(name=>/^gpu-gdb-.*\.log$/.test(name)).map(name=>({
            name,text:readFileSync(join(directory,name),'utf8'),
          }))
          const controls=logs(join(root,'debugger-control')),browser=logs(root)
          const witnessed=rows=>rows.filter(row=>row.text.includes('BLENDLINK_GPU_DEBUGGER_WRAPPER_STARTED')&&/received signal SIGTRAP/.test(row.text)&&/^#0\s/m.test(row.text)).map(row=>row.name)
          const result={kind:'native-debugger-signal-evidence-not-node-qualification',
            controlLogs:controls.map(row=>row.name),controlWitnesses:witnessed(controls),
            browserLogs:browser.map(row=>row.name),browserWitnesses:witnessed(browser)}
          writeFileSync(join(root,'native-signal-witness.json'),JSON.stringify(result,null,2))
          assert.ok(result.controlWitnesses.length,'The separate known SIGTRAP control must calibrate gdb')
          assert.ok(result.browserLogs.length,'GPU launcher was not actually executed; no native backtrace captured')
          assert.ok(result.browserWitnesses.length,'No actual browser SIGTRAP/native backtrace captured')
          console.log('BLENDLINK_CAMERA_NATIVE_GPU_SIGNAL_CAPTURED',JSON.stringify(result))
          JS

      - name: Retain native backtraces, exact binary pins and public API report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camera-graphite-native-gpu-crash-linux
          path: artifacts/verification-camera-gpu-crash
          if-no-files-found: warn
