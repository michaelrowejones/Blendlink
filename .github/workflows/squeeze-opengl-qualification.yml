name: Squeeze Linux production-profile candidate qualification

on:
  push:
    branches: [codex/qualify-squeeze-opengl]

permissions:
  contents: read

concurrency:
  group: squeeze-opengl-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux52:
    name: Native EEVEE 5.2 exact Linux source-profile candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      BLENDLINK_TEST_PROFILE: software
      BLENDLINK_TEST_CHROMIUM_CHANNEL: chromium
      BLENDLINK_TEST_CHROMIUM_ARGS: '["--use-angle=swiftshader","--use-webgpu-adapter=swiftshader"]'
    steps:
      - name: Check out the exact isolated candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache checksum-pinned Blender archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blender-5.2.0-linux-x64.tar.xz
          key: blender-archive-${{ runner.os }}-${{ runner.arch }}-96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48

      - name: Download and verify actual Blender 5.2.0
        env:
          BLENDER_SHA256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
        run: |
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' --output "$archive"
          fi
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender-squeeze"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender-squeeze" --strip-components=1
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender-squeeze/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software graphics dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils xvfb
          npx --no-install playwright install --with-deps chromium

      - name: Build the private source-profile candidate
        run: npm run build

      - name: Capture native EEVEE and actual Final on both browser APIs
        run: |
          xvfb-run --auto-servernum node experiments/squeeze-node-differential/suite.mjs --built \
            --blender "$BLENDLINK_BLENDER" --output artifacts/verification-squeeze-opengl52

      - name: State the private proof boundary
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,writeFile} from 'node:fs/promises'
          const directory='artifacts/verification-squeeze-opengl52'
          const suite=JSON.parse(await readFile(directory+'/suite-software.json'))
          const references=JSON.parse(await readFile(directory+'/references.json'))
          assert.equal(suite.status,'passed')
          assert.equal(suite.productionCases,25)
          assert.equal(references.backend.backend,'OPENGL')
          assert.equal(references.backend.renderer,'llvmpipe (LLVM 20.1.2, 256 bits)')
          assert.equal(references.build,'fbe6228777e7')
          for(const mode of ['raw','final']){
            const report=JSON.parse(await readFile(directory+'/browser-'+mode+'-software.json'))
            assert.equal(report.status,'passed')
            assert.deepEqual(report.rows.map(row=>row.backend).sort(),['webgl2','webgpu'])
            assert.ok(report.rows.every(row=>row.rows.length===26&&row.failures.length===0))
          }
          await writeFile(directory+'/trial-receipt.json',JSON.stringify({proofRole:'PRODUCTION_SOURCE_PROFILE_CANDIDATE',publicMainProductionAdmissionCases:0,candidateCasesPerApiAndPath:suite.productionCases,sourceProfile:'linux-x86_64-llvmpipe20-opengl-v1',native:references.backend,publicMainSourceProfileUnchanged:true},null,2))
          JS

      - name: Retain native, failed and Final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-candidate-squeeze-opengl52
          path: artifacts/verification-squeeze-opengl52
          if-no-files-found: warn
          retention-days: 30
