name: Native node canaries

on:
  pull_request:
    paths:
      - '.github/workflows/static-noise.yml'
      - 'packages/**'
      - 'experiments/noise-fractal-differential/**'
      - 'experiments/static-noise-fbm/**'
      - 'experiments/native-compositor-differential/**'
      - 'experiments/magic-node-differential/**'
      - 'experiments/legacy-shader-hsv/**'
      - 'scripts/lib/**'
      - 'package*.json'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-noise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-static-color:
    name: Native Noise / Linux SwiftShader
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download and verify Blender 5.2.0
        env:
          BLENDER_SHA256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
        run: |
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' \
            --output "$archive"
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software rendering libraries
        id: build
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      # Keep Chromium's ordinary watchdog. This native subset contains the
      # formerly fatal constant Color cases, controls and non-folded distortion
      # cases; a literal shader must still earn its original native pixel budget.
      - name: Compare native static raw FBM on both browser backends
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_STATIC_4D_ONLY: '1'
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/raw

      - name: Compare native static normalized FBM on both browser backends
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_STATIC_4D_ONLY: '1'
          BLENDLINK_NOISE_NORMALIZED: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/normalized

      - name: Compare high-detail raw 4D Color fields with the normal watchdog
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/raw-field

      - name: Compare high-detail normalized 4D Color fields with the normal watchdog
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_NORMALIZED: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/normalized-field

      - name: Compare prepared raw Noise with HDR and repeated UV controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_FIELD_TABLE_CONTROLS: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/prepared-raw-field

      - name: Compare prepared normalized Noise with HDR and repeated UV controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_FIELD_TABLE_CONTROLS: '1'
          BLENDLINK_NOISE_NORMALIZED: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/prepared-normalized-field

      - name: Compare prepared raw Noise at the full field-table limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_FIELD_TABLE_CONTROLS: '1'
          BLENDLINK_NOISE_FIELD_CAP: '1'
          BLENDLINK_NOISE_REFERENCE_SIZE: '128'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/prepared-raw-cap

      - name: Compare prepared normalized Noise at the full field-table limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_NOISE_FIELD_FOCUS: '1'
          BLENDLINK_NOISE_FIELD_TABLE_CONTROLS: '1'
          BLENDLINK_NOISE_FIELD_CAP: '1'
          BLENDLINK_NOISE_REFERENCE_SIZE: '128'
          BLENDLINK_NOISE_NORMALIZED: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_TYPES: '["FBM"]'
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/prepared-normalized-cap

      - name: Verify prepared Noise installation, cancellation and resource cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          xvfb-run --auto-servernum node experiments/noise-field-production/run.mjs
          artifacts/verification-static-noise-ci/prepared-raw-cap/reference
          artifacts/verification-static-noise-ci/ownership
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: Compare native MF large-coordinate Math Modulo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node experiments/noise-fractal-differential/run.mjs --built
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_MATH_MODULO_NATIVE: '1'
          BLENDLINK_MATH_MODULO_MF_ONLY: '1'
          BLENDLINK_NOISE_ENGINE: EEVEE
          BLENDLINK_NOISE_EVIDENCE: artifacts/verification-static-noise-ci/math-modulo-mf

      - name: Verify native Noise admission and installed-package imports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node scripts/test-addon-headless.mjs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_HEADLESS_ONLY: noise
          BLENDLINK_TEST_CYCLES_DEVICE: CPU

      - name: Retain native inputs, pixels and browser failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-noise-linux-5.2
          path: artifacts/verification-static-noise-ci
          if-no-files-found: warn

  native-legacy-hsv:
    name: Native legacy HSV / EEVEE OpenGL / Blender 4.2.0 / Linux SwiftShader
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download and verify Blender 4.2.0
        env:
          BLENDER_SHA256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
        run: |
          archive="$RUNNER_TEMP/blender-4.2.0-linux-x64.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            'https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz' \
            --output "$archive"
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software rendering libraries
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      - name: Verify actual legacy source sockets and isolated extension emission
        env:
          BLENDLINK_HSV_PACKAGED_ADDON: ${{ github.workspace }}/packages/blendlink/dist/addon
        run: |
          "$BLENDLINK_BLENDER" --background --factory-startup --python-exit-code 1 \
            --python packages/blender-addon/tests/legacy_shader_hsv_check.py

      # No retained reference reuse, physical-browser channel or watchdog
      # override: this must earn the actual OpenGL source profile independently
      # of the local Metal results, with the same calibration/kernel budgets.
      - name: Generate native EEVEE references and compare both browser backends
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_HSV_EVIDENCE: artifacts/verification-legacy-hsv-linux42
          BLENDLINK_TEST_CHROMIUM_ARGS: '[]'
        run: env -u BLENDLINK_TEST_CHROMIUM_CHANNEL xvfb-run --auto-servernum node experiments/legacy-shader-hsv/run.mjs --built

      - name: Retain source profile, native pixels, calibration and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-hsv-opengl-linux-4.2
          path: artifacts/verification-legacy-hsv-linux42
          if-no-files-found: warn

  native-magic:
    name: Native EEVEE Magic / OpenGL / Blender 5.2.0 / Linux SwiftShader
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download and verify Blender 5.2.0
        env:
          BLENDER_SHA256: '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48'
        run: |
          archive="$RUNNER_TEMP/blender-5.2.0-linux-x64.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' \
            --output "$archive"
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software rendering libraries
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      # No retained reference reuse, physical-browser channel or watchdog
      # override: this must earn the actual OpenGL source profile independently
      # of the local Metal results, with the same calibration/kernel budgets.
      - name: Generate native EEVEE references and compare both browser backends
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_MAGIC_EVIDENCE: artifacts/verification-magic-linux52
          BLENDLINK_TEST_CHROMIUM_ARGS: '[]'
        run: env -u BLENDLINK_TEST_CHROMIUM_CHANNEL xvfb-run --auto-servernum node experiments/magic-node-differential/run.mjs --built

      - name: Retain source profile, native pixels, calibration and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magic-opengl-linux-5.2
          path: artifacts/verification-magic-linux52
          if-no-files-found: warn

  native-compositor:
    name: Native ${{ matrix.family }} / ${{ matrix.source_device }} / Blender ${{ matrix.blender_version || '5.2.0' }} / Linux SwiftShader
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [Luminance Key, Difference Key, Distance Key, Distance Key legacy, Channel Key, Channel Key source profile, Color Spill, Color Key, Color Key GPU subset, Chroma Key, Image, Composite Output, Crop, Crop Resize, Pixelate, Split, Split source profile, Split legacy, Map Value, Map Value source profile, Map Value modern absence]
        source_device: [CPU, GPU]
        exclude:
          - family: Color Key
            source_device: GPU
          - family: Color Key GPU subset
            source_device: CPU
          - family: Chroma Key
            source_device: GPU
          - family: Distance Key
            source_device: GPU
          - family: Distance Key legacy
            source_device: GPU
          - family: Channel Key
            source_device: GPU
          - family: Channel Key source profile
            source_device: CPU
          - family: Image
            source_device: GPU
          - family: Crop Resize
            source_device: GPU
          - family: Split
            source_device: GPU
          - family: Split source profile
            source_device: CPU
          - family: Map Value
            source_device: GPU
          - family: Map Value source profile
            source_device: CPU
          - family: Map Value modern absence
            source_device: GPU
        include:
          - family: Luminance Key
            fixture: compositor_luminance_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_LUMINANCE_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_LUMINANCE_KEY_REFERENCES
            evidence: luma
          - family: Difference Key
            fixture: compositor_difference_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_DIFFERENCE_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_DIFFERENCE_KEY_REFERENCES
            evidence: difference
          - family: Distance Key
            fixture: compositor_distance_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_DISTANCE_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_DISTANCE_KEY_REFERENCES
            evidence: distance
          - family: Distance Key legacy
            fixture: compositor_distance_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_DISTANCE_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_DISTANCE_KEY_REFERENCES
            evidence: distance-legacy
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Channel Key
            fixture: compositor_channel_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_CHANNEL_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_CHANNEL_KEY_REFERENCES
            evidence: channel-key
          - family: Channel Key source profile
            fixture: compositor_channel_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_CHANNEL_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_CHANNEL_KEY_REFERENCES
            evidence: channel-key
          - family: Color Spill
            fixture: compositor_spill_check.py
            device_variable: BLENDLINK_COMPOSITOR_SPILL_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_SPILL_REFERENCES
            evidence: spill
          - family: Color Key
            fixture: compositor_color_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_COLOR_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_COLOR_KEY_REFERENCES
            evidence: color-key
          - family: Color Key GPU subset
            fixture: compositor_color_key_gpu_subset_check.py
            device_variable: BLENDLINK_COMPOSITOR_COLOR_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_COLOR_KEY_GPU_REFERENCES
            evidence: color-key-gpu-subset
          - family: Chroma Key
            fixture: compositor_chroma_key_check.py
            device_variable: BLENDLINK_COMPOSITOR_CHROMA_KEY_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_CHROMA_KEY_REFERENCES
            evidence: chroma-key
          - family: Crop
            fixture: compositor_crop_check.py
            device_variable: BLENDLINK_COMPOSITOR_CROP_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_CROP_REFERENCES
            evidence: crop
          - family: Crop Resize
            fixture: compositor_crop_resize_check.py
            device_variable: BLENDLINK_COMPOSITOR_CROP_RESIZE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_CROP_RESIZE_REFERENCES
            evidence: crop-resize
          - family: Pixelate
            fixture: compositor_pixelate_check.py
            device_variable: BLENDLINK_COMPOSITOR_PIXELATE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_PIXELATE_REFERENCES
            evidence: pixelate
          - family: Split
            fixture: compositor_split_check.py
            device_variable: BLENDLINK_COMPOSITOR_SPLIT_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_SPLIT_REFERENCES
            evidence: split
          - family: Split source profile
            fixture: compositor_split_check.py
            device_variable: BLENDLINK_COMPOSITOR_SPLIT_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_SPLIT_REFERENCES
            evidence: split-source-profile
          - family: Split legacy
            fixture: compositor_split_check.py
            device_variable: BLENDLINK_COMPOSITOR_SPLIT_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_SPLIT_REFERENCES
            evidence: split-legacy
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value
            profile_expected: qualified
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value source profile
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value-source-profile
            profile_expected: source-profile-refused
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value modern absence
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value-native-absent
            profile_expected: native-node-absent
          - family: Image
            fixture: compositor_image_check.py
            device_variable: BLENDLINK_COMPOSITOR_IMAGE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_IMAGE_REFERENCES
            evidence: image
          - family: Composite Output
            fixture: compositor_output_alpha_check.py
            device_variable: BLENDLINK_COMPOSITOR_OUTPUT_ALPHA_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_OUTPUT_ALPHA_REFERENCES
            evidence: output-alpha
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download and verify the selected Blender version
        env:
          BLENDER_VERSION: ${{ matrix.blender_version || '5.2.0' }}
          BLENDER_SERIES: ${{ matrix.blender_series || '5.2' }}
          BLENDER_SHA256: ${{ matrix.blender_sha256 || '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48' }}
        run: |
          archive="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            "https://download.blender.org/release/Blender$BLENDER_SERIES/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            --output "$archive"
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software rendering libraries
        id: build
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      - name: Compare native compositing on both browser backends
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SOURCE_DEVICE: ${{ matrix.source_device }}
          DEVICE_VARIABLE: ${{ matrix.device_variable }}
          REFERENCE_VARIABLE: ${{ matrix.reference_variable }}
          FIXTURE: ${{ matrix.fixture }}
          EVIDENCE: artifacts/verification-compositor-canary/${{ matrix.evidence }}
          SOURCE_PROFILE_EXPECTED: ${{ matrix.profile_expected }}
        run: |
          env "$DEVICE_VARIABLE=$SOURCE_DEVICE" \
            "$REFERENCE_VARIABLE=$PWD/$EVIDENCE-$SOURCE_DEVICE" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 \
              --python "packages/blender-addon/tests/$FIXTURE"
          if [ "$FIXTURE" = "compositor_channel_key_check.py" ]; then
            node scripts/check-channel-profile.mjs "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_split_check.py" ]; then
            node scripts/check-split-profile.mjs "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_map_value_check.py" ]; then
            node scripts/check-map-value-profile.mjs --current-sources --expect "$SOURCE_PROFILE_EXPECTED" "$EVIDENCE-$SOURCE_DEVICE"
            if [ "$SOURCE_PROFILE_EXPECTED" = "native-node-absent" ]; then
              echo "Native Map Value is absent; zero numerical/browser cases are claimed."
              exit 0
            fi
          fi
          additional_references=()
          if [ "$FIXTURE" = "compositor_distance_key_check.py" ]; then
            for controls in zero amplified; do
              falloff=0
              alpha=2
              if [ "$controls" = "amplified" ]; then falloff=.125; alpha=1e20; fi
              BLENDLINK_DISTANCE_ZERO_REFERENCES="$PWD/$EVIDENCE-$controls" \
                BLENDLINK_DISTANCE_ZERO_FALLOFF="$falloff" BLENDLINK_DISTANCE_ZERO_ALPHA="$alpha" \
                xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
                  --background --factory-startup --python-exit-code 1 \
                  --python experiments/compositor-distance-key-differential/native_zero_distance.py
              additional_references+=("$EVIDENCE-$controls")
            done
          fi
          xvfb-run --auto-servernum node experiments/native-compositor-differential/run.mjs --built \
            --out "$EVIDENCE-browser" "$EVIDENCE-$SOURCE_DEVICE" "${additional_references[@]}"

      - name: Qualify CPU Distance arithmetic independently
        if: always() && steps.build.outcome == 'success' && matrix.family == 'Distance Key' && matrix.source_device == 'CPU'
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_DISTANCE_EXPECTED_NATIVE: '5.2.0'
          EVIDENCE: artifacts/verification-compositor-canary/distance-primitives-CPU
        run: |
          BLENDLINK_DISTANCE_SQRT_REFERENCES="$PWD/$EVIDENCE/sqrt" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 -t 1 \
              --python experiments/compositor-distance-key-differential/native_sqrt.py
          BLENDLINK_DISTANCE_RATIO_REFERENCES="$PWD/$EVIDENCE/ratio" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 -t 1 \
              --python experiments/compositor-distance-key-differential/native_ratio.py
          # Independent primitive proof snapshots production TS helper source.
          # The preceding family comparison separately verifies built JS graphs.
          xvfb-run --auto-servernum node experiments/compositor-distance-key-differential/sqrt-run.mjs \
            "$EVIDENCE/sqrt" "$EVIDENCE/ratio" --out "$EVIDENCE/browser"

      - name: Retain native inputs, pixels and browser failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compositor-canary-${{ matrix.evidence }}-${{ matrix.source_device }}-linux-${{ matrix.blender_series || '5.2' }}
          path: artifacts/verification-compositor-canary
          if-no-files-found: warn
