          - family: Split legacy
            fixture: compositor_split_check.py
            device_variable: BLENDLINK_COMPOSITOR_SPLIT_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_SPLIT_REFERENCES
            evidence: split-legacy
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value
            profile_expected: qualified
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value source profile
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value-source-profile
            profile_expected: source-profile-refused
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
          - family: Map Value modern absence
            fixture: compositor_map_value_check.py
            device_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_MAP_VALUE_REFERENCES
            evidence: map-value-native-absent
            profile_expected: native-node-absent
          - family: Image
            fixture: compositor_image_check.py
            device_variable: BLENDLINK_COMPOSITOR_IMAGE_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_IMAGE_REFERENCES
            evidence: image
          - family: Composite Output
            fixture: compositor_output_alpha_check.py
            device_variable: BLENDLINK_COMPOSITOR_OUTPUT_ALPHA_DEVICE
            reference_variable: BLENDLINK_COMPOSITOR_OUTPUT_ALPHA_REFERENCES
            evidence: output-alpha
            blender_version: '4.2.0'
            blender_series: '4.2'
            blender_sha256: '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache checksum-pinned Blender archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blender-${{ matrix.blender_version || '5.2.0' }}-linux-x64.tar.xz
          key: blender-archive-${{ runner.os }}-${{ runner.arch }}-${{ matrix.blender_sha256 || '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48' }}

      - name: Download and verify the selected Blender version
        env:
          BLENDER_VERSION: ${{ matrix.blender_version || '5.2.0' }}
          BLENDER_SERIES: ${{ matrix.blender_series || '5.2' }}
          BLENDER_SHA256: ${{ matrix.blender_sha256 || '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48' }}
        run: |
          archive="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              "https://download.blender.org/release/Blender$BLENDER_SERIES/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
              --output "$archive"
          fi
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install locked tools and software rendering libraries
        id: build
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      - name: Compare native compositing on both browser backends
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SOURCE_DEVICE: ${{ matrix.source_device }}
          DEVICE_VARIABLE: ${{ matrix.device_variable }}
          REFERENCE_VARIABLE: ${{ matrix.reference_variable }}
          FIXTURE: ${{ matrix.fixture }}
          EVIDENCE: artifacts/verification-compositor-canary/${{ matrix.evidence }}
          SOURCE_PROFILE_EXPECTED: ${{ matrix.profile_expected }}
        run: |
          env "$DEVICE_VARIABLE=$SOURCE_DEVICE" \
            "$REFERENCE_VARIABLE=$PWD/$EVIDENCE-$SOURCE_DEVICE" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 \
              --python "packages/blender-addon/tests/$FIXTURE"
          if [ "$FIXTURE" = "compositor_channel_key_check.py" ]; then
            node scripts/check-channel-profile.mjs "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_split_check.py" ]; then
            node scripts/check-split-profile.mjs "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_difference_key_check.py" ]; then
            node scripts/check-difference-precision.mjs --ordinary "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_difference_precision_check.py" ]; then
            node scripts/check-difference-precision.mjs "$EVIDENCE-$SOURCE_DEVICE"
          fi
          if [ "$FIXTURE" = "compositor_map_value_check.py" ]; then
            node scripts/check-map-value-profile.mjs --current-sources --expect "$SOURCE_PROFILE_EXPECTED" "$EVIDENCE-$SOURCE_DEVICE"
            if [ "$SOURCE_PROFILE_EXPECTED" = "native-node-absent" ]; then
              echo "Native Map Value is absent; zero numerical/browser cases are claimed."
              exit 0
            fi
          fi
          additional_references=()
          if [ "$FIXTURE" = "compositor_difference_precision_check.py" ] && [ "$SOURCE_DEVICE" = "CPU" ]; then
            BLENDLINK_DIFFERENCE_TINY_REFERENCES="$PWD/$EVIDENCE-tiny-$SOURCE_DEVICE" \
              xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
                --background --factory-startup --python-exit-code 1 -t 1 \
                --python experiments/compositor-difference-key-differential/native_tiny.py
            node scripts/check-difference-precision.mjs --tiny "$EVIDENCE-tiny-$SOURCE_DEVICE"
            additional_references+=("$EVIDENCE-tiny-$SOURCE_DEVICE")
          fi
          if [ "$FIXTURE" = "compositor_distance_key_check.py" ]; then
            for controls in zero amplified; do
              falloff=0
              alpha=2
              if [ "$controls" = "amplified" ]; then falloff=.125; alpha=1e20; fi
              BLENDLINK_DISTANCE_ZERO_REFERENCES="$PWD/$EVIDENCE-$controls" \
                BLENDLINK_DISTANCE_ZERO_FALLOFF="$falloff" BLENDLINK_DISTANCE_ZERO_ALPHA="$alpha" \
                xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
                  --background --factory-startup --python-exit-code 1 \
                  --python experiments/compositor-distance-key-differential/native_zero_distance.py
              additional_references+=("$EVIDENCE-$controls")
            done
          fi
          xvfb-run --auto-servernum node experiments/native-compositor-differential/run.mjs --built \
            --out "$EVIDENCE-browser" "$EVIDENCE-$SOURCE_DEVICE" "${additional_references[@]}"

      - name: Qualify CPU Distance arithmetic independently
        if: always() && steps.build.outcome == 'success' && matrix.family == 'Distance Key' && matrix.source_device == 'CPU'
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_DISTANCE_EXPECTED_NATIVE: '5.2.0'
          EVIDENCE: artifacts/verification-compositor-canary/distance-primitives-CPU
        run: |
          BLENDLINK_DISTANCE_SQRT_REFERENCES="$PWD/$EVIDENCE/sqrt" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 -t 1 \
              --python experiments/compositor-distance-key-differential/native_sqrt.py
          BLENDLINK_DISTANCE_RATIO_REFERENCES="$PWD/$EVIDENCE/ratio" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 -t 1 \
              --python experiments/compositor-distance-key-differential/native_ratio.py
          # Independent primitive proof snapshots production TS helper source.
          # The preceding family comparison separately verifies built JS graphs.
          xvfb-run --auto-servernum node experiments/compositor-distance-key-differential/sqrt-run.mjs \
            "$EVIDENCE/sqrt" "$EVIDENCE/ratio" --out "$EVIDENCE/browser"

      - name: Qualify CPU Difference mean independently
        if: always() && steps.build.outcome == 'success' && matrix.family == 'Difference Key' && matrix.source_device == 'CPU'
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_DIFFERENCE_EXPECTED_NATIVE: '5.2.0'
          EVIDENCE: artifacts/verification-compositor-canary/difference-mean-CPU
        run: |
          BLENDLINK_DIFFERENCE_MEAN_REFERENCES="$PWD/$EVIDENCE/native" \
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" \
              --background --factory-startup --python-exit-code 1 -t 1 \
              --python experiments/compositor-difference-key-differential/native_mean.py
          # Source-helper qualification, separate from the built graph gate.
          xvfb-run --auto-servernum node experiments/compositor-difference-key-differential/mean-run.mjs \
            "$EVIDENCE/native" --out "$EVIDENCE/browser"

      - name: Retain native inputs, pixels and browser failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compositor-canary-${{ matrix.evidence }}-${{ matrix.source_device }}-linux-${{ matrix.blender_series || '5.2' }}
          path: artifacts/verification-compositor-canary
          if-no-files-found: warn

  native-vector-component:
    name: Native fixed Vector Component / EEVEE OpenGL / Blender 5.3.0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache checksum-pinned Blender archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/blender-5.3.0-linux-x64.tar.xz
          key: blender-archive-${{ runner.os }}-${{ runner.arch }}-dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05

      - name: Download and verify Blender 5.3.0
        env:
          BLENDER_SHA256: 'dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05'
        run: |
          archive="$RUNNER_TEMP/blender-5.3.0-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              'https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz' \
              --output "$archive"
          fi
          echo "$BLENDER_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDLINK_BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Build locked tools and software rendering libraries
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 mesa-utils
          npx --no-install playwright install --with-deps chromium
          npm run build

      - name: Verify actual source schema, fixed literals, refusals and packed source planning
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_VECTOR_COMPONENT_PACKAGED_ADDON: ${{ github.workspace }}/packages/blendlink/dist/addon
          BLENDLINK_VECTOR_COMPONENT_SCHEMA: artifacts/verification-vector-component-linux53/source-schema.json
        run: |
          "$BLENDLINK_BLENDER" --background --factory-startup -t 1 --python-exit-code 1 \
            --python packages/blender-addon/tests/vector_component_check.py
          node scripts/check-vector-component-profile.mjs --source "$BLENDLINK_VECTOR_COMPONENT_SCHEMA"

      - name: Compare fresh native EEVEE selections and exact raw browser controls
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_VECTOR_COMPONENT_EVIDENCE: artifacts/verification-vector-component-linux53/browser
          BLENDLINK_VECTOR_COMPONENT_NATIVE_BACKEND: OPENGL
          BLENDLINK_TEST_CHROMIUM_ARGS: '[]'
        run: |
          env -u BLENDLINK_TEST_CHROMIUM_CHANNEL xvfb-run --auto-servernum node experiments/vector-component-differential/run.mjs --built
          node scripts/check-vector-component-profile.mjs --browser "$BLENDLINK_VECTOR_COMPONENT_EVIDENCE/report.json"
          xvfb-run --auto-servernum "$BLENDLINK_BLENDER" --background --factory-startup --gpu-backend opengl -t 1 --python-exit-code 1 \
            --python-expr 'import gpu; gpu.init()' \
            --python experiments/native-compositor-differential/capabilities.py \
            -- artifacts/verification-vector-component-linux53/native-capabilities.json
          node -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); const record = JSON.parse(fs.readFileSync("artifacts/verification-vector-component-linux53/native-capabilities.json")); assert.equal(record.gpuPlatform.backend, "OPENGL"); assert.equal(record.blenderHash, "02f0899d78e3")'

      - name: Compare native compositor fixed selections and independent Separate XYZ
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          BLENDLINK_COMPOSITOR_COMPONENT_PACKAGED_ADDON: ${{ github.workspace }}/packages/blendlink/dist/addon
        run: |
          for device in CPU GPU; do
            export BLENDLINK_COMPOSITOR_COMPONENT_DEVICE="$device"
            export BLENDLINK_COMPOSITOR_COMPONENT_REFERENCES="artifacts/verification-vector-component-linux53/compositor-$device"
            xvfb-run --auto-servernum "$BLENDLINK_BLENDER" --background --factory-startup --gpu-backend opengl -t 1 --python-exit-code 1 \
              --python packages/blender-addon/tests/compositor_vector_component_check.py
            node scripts/check-compositor-component.mjs --source "$BLENDLINK_COMPOSITOR_COMPONENT_REFERENCES"
          done
          env -u BLENDLINK_TEST_CHROMIUM_CHANNEL xvfb-run --auto-servernum node experiments/native-compositor-differential/run.mjs --built \
            --out artifacts/verification-vector-component-linux53/compositor-browser \
            artifacts/verification-vector-component-linux53/compositor-CPU artifacts/verification-vector-component-linux53/compositor-GPU
          node scripts/check-compositor-component.mjs --browser artifacts/verification-vector-component-linux53/compositor-browser/results.json \
            artifacts/verification-vector-component-linux53/compositor-CPU artifacts/verification-vector-component-linux53/compositor-GPU

      - name: Retain source, native pixels, immutable runtime and both proof roles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-component-eevee-opengl-linux-5.3
          path: artifacts/verification-vector-component-linux53
          if-no-files-found: warn
