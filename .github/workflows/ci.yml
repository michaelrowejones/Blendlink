name: Node contract

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contract:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.15.0"
          - "22"
          - "24"

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify the production dependency audit
        if: matrix.node == '22.15.0'
        run: npm run audit:production

      - name: Compile workspace consumers
        run: node scripts/test-consumer-builds.mjs

      - name: Inspect and compile the packed npm package
        run: node scripts/test-package.mjs
